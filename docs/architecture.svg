<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 500" role="img" aria-labelledby="title desc">
<title id="title">MLTool / MedML architecture</title><desc id="desc">A Tkinter interface configures an Excel classification experiment. Data preparation and optional RFECV feed per-model training threads. Results are inspected and exported locally.</desc>
<defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#7a91ac"/></marker></defs>
<rect width="1120" height="500" rx="24" fill="#f5f8fc"/>
<text x="32" y="40" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" fill="#3774aa">DESKTOP CLASSIFICATION WORKFLOW</text><text x="32" y="80" font-family="Arial, Helvetica, sans-serif" font-size="30" font-weight="700" fill="#132d4b">MLTool / MedML</text><text x="32" y="110" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="400" fill="#52647b">From a local workbook to comparable experiments and inspectable results.</text><rect x="32" y="135" width="320" height="210" rx="18" fill="#ffffff" stroke="#dce5ef"/><rect x="52" y="153" width="32" height="28" rx="8" fill="#e5efff" stroke="none"/><text x="61" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#215b9d">1</text><text x="97" y="174" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162c47">Configure</text><text x="54" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#256797">UI.py + Controller</text><text x="54" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Load an Excel workbook</text><text x="54" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Select a target and test split</text><text x="54" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Set variable types and options</text><text x="54" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Choose the classifiers to train</text><rect x="400" y="135" width="320" height="210" rx="18" fill="#ffffff" stroke="#dce5ef"/><rect x="420" y="153" width="32" height="28" rx="8" fill="#e5efff" stroke="none"/><text x="429" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#215b9d">2</text><text x="465" y="174" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162c47">Prepare</text><text x="422" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#256797">Data + scikit-learn pipelines</text><text x="422" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Separate training and test rows</text><text x="422" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Scale and encode inputs</text><text x="422" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Optionally select with RFECV</text><text x="422" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Transform data for model fitting</text><rect x="768" y="135" width="320" height="210" rx="18" fill="#ffffff" stroke="#dce5ef"/><rect x="788" y="153" width="32" height="28" rx="8" fill="#e5efff" stroke="none"/><text x="797" y="173" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700" fill="#215b9d">3</text><text x="833" y="174" font-family="Arial, Helvetica, sans-serif" font-size="21" font-weight="700" fill="#162c47">Train &amp; compare</text><text x="790" y="210" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" fill="#256797">AsyncTrainModel + ModelWrapper</text><text x="790" y="243" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">One worker per chosen model</text><text x="790" y="267" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Five-fold cross-validation</text><text x="790" y="291" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Fit training data; predict test rows</text><text x="790" y="315" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#52647b">Six classifier implementations</text><path d="M 354 240 L 393 240" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 722 240 L 761 240" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><path d="M 928 347 L 928 380" fill="none" stroke="#7a91ac" stroke-width="2.5" marker-end="url(#arrow)"/><rect x="32" y="385" width="1056" height="72" rx="14" fill="#e8f4f2" stroke="#c8e2dc"/><text x="54" y="414" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" fill="#247967">INSPECT &amp; EXPORT</text><text x="245" y="414" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700" fill="#163e38">Scores and confusion matrices in the desktop UI</text><text x="245" y="440" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="400" fill="#3f665d">Local MedML/ output: fitted estimators, result arrays and optional selected-feature names</text><text x="32" y="483" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="400" fill="#52647b">Source-level architecture • Prototype limitations and export boundaries are documented in the README.</text></svg>
